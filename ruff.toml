line-length = 100
# скрипт задач — готовый инструмент, не код проекта
extend-exclude = ["tools/backlog.py"]

[lint]
# E, W, F — ошибки и мусор; I — порядок импортов; B — частые баги;
# UP — устаревший синтаксис; S — безопасность (ключи в коде, небезопасные вызовы);
# C90 — сложность функции.
select = ["E", "W", "F", "I", "B", "UP", "S", "C90"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# assert в тестах — норма
"tests/**" = ["S101"]
