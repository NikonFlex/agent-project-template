# Исключения gitleaks (tools/secret_scan.py). Правила — стандартные, ниже — только то, что
# точно не ключ, и у каждой строки — причина. Ключ сюда не вносится: его убирают в .env и меняют.
title = "исключения проекта"

[extend]
useDefault = true

[allowlist]
description = "не ключи"
paths = [
  # пример переменных окружения без значений (AGENTS.md, «Ключи и деньги»)
  '''^\.env\.example$''',
]
