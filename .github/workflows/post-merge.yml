name: post-merge

# Полный набор тестов на main после слияния: долгие (slow) — то, чего нет в `fast` на PR.
# Упавшие гоняются ещё раз; итог — комментарием в задачи из `Closes` влитых PR, новый красный
# переоткрывает их (tools/post_merge.py). Запуск: слияние человеком (push в main) или
# workflow_dispatch — его делает job `automerge` (check.yml): слияние токеном CI на push не
# реагирует. Идущий прогон не отменяется; слияния за время прогона ждут одним прогоном на
# последнем коммите — его диапазон охватывает их все.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-merge-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Прошлый прогон
        id: prev
        run: python3 tools/post_merge.py prev >> "$GITHUB_OUTPUT"

      - name: Упавшие тесты прошлого прогона
        if: steps.prev.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: failed-tests
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ github.token }}
          path: prev

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-testmon -r tools/requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Полный набор, красные — ещё раз
        # Код 5 у pytest — «тестов нет»: отчёт JUnit всё равно пишется, набор зелёный.
        # Шаг идёт под `bash -e`: `cmd; code=$?` оборвал бы его на первом ненулевом коде.
        run: |
          mkdir -p junit
          code=0
          python -m pytest -q --junitxml=junit/final.xml || code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          echo "повтор упавших"
          python -m pytest -q --last-failed --junitxml=junit/final.xml || true

      - name: Итог в задачи
        if: always()
        run: >-
          python3 tools/post_merge.py verdict
          --junit junit/final.xml --prev-failed prev/failed.txt --out-failed failed.txt
          --base "${{ steps.prev.outputs.sha }}" --head "${{ github.sha }}"

      - name: Список упавших для следующего прогона
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests
          path: failed.txt
          if-no-files-found: ignore
