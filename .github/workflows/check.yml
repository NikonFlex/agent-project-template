name: check

# Проверки PR: `fast` (быстрые тесты и самопроверки), `pr-link` (ссылка на задачу, слова
# закрытия) и `automerge`. Полный набор тестов — после слияния (post-merge.yml). В приватном
# репозитории на бесплатном тарифе защиты ветки и встроенного автослияния нет, поэтому
# сливает job `automerge` токеном CI. Правка описания и метка гоняют всё: `fast` дешёвый.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]

permissions:
  contents: read
  pull-requests: read

# PR, открытый сразу с меткой, даёт события opened и labeled — два прогона и два слияния.
# Прогоны одного PR — в одну очередь, устаревший отменяется.
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # вся история: номер задачи проверяется во всех коммитах ветки от базы
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Стек по умолчанию — Python. Другой язык — /bootstrap заменяет зависимости,
      # линтер и тесты на свои; шаги процесса ниже остаются.
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-testmon -r tools/requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: gitleaks
        # Архив релиза, сверенный по контрольным суммам; версия — tools/secret_scan.py.
        run: |
          python3 tools/secret_scan.py install --binary
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Проверки
        # Быстрые тесты и самопроверки; долгие (slow) — в полном наборе после слияния.
        # Локально хук гоняет `check.sh --quick` — только затронутые тесты.
        run: sh tools/check.sh --fast

      - name: Номер задачи в каждом коммите
        # Хук commit-msg обходится `--no-verify` — поэтому то же правило здесь.
        run: python3 tools/commit_check.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Ключи в коммитах
        # Хук pre-commit обходится `--no-verify` — поэтому то же по всем коммитам PR.
        run: python3 tools/secret_scan.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  pr-link:
    # Ссылка на задачу и слова закрытия: в теле PR — `Closes #N` или `Part of #N`
    # (tools/pr_link.py), в заголовке и коммитах слов закрытия нет (tools/closing_words.py).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Тело, заголовок и коммиты PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" \
            --json title,body,commits > pr.json
          python3 tools/closing_words.py --pr pr.json

  automerge:
    # PR с меткой automerge сливается, когда `fast` и `pr-link` зелёные.
    needs: [fast, pr-link]
    if: >-
      contains(github.event.pull_request.labels.*.name, 'automerge')
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Слить
        run: gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --merge

      # Слияние токеном CI не закрывает задачи из `Closes` (правило GitHub для
      # GITHUB_TOKEN), поэтому закрываем их сами; красный полный набор их переоткроет.
      - name: Закрыть задачи из Closes
        # `set -o pipefail`: у Actions шаг идёт под `bash -e` без него — сбой `gh pr view` прошёл бы молча.
        run: |
          set -o pipefail
          gh pr view ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --json body -q .body \
            | python3 tools/pr_link.py closes "${{ github.repository }}" \
            | tee closed.txt \
            | while read -r ref; do
                gh issue close "${ref##*#}" --repo "${ref%#*}" --reason completed
              done

      # Слияние токеном CI не порождает запуск workflow на push в main (правило GitHub для
      # GITHUB_TOKEN; исключение — workflow_dispatch), поэтому полный набор запускается явно.
      - name: Полный набор после слияния
        run: gh workflow run post-merge.yml --repo "${{ github.repository }}" --ref main
