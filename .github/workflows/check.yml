name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Стек по умолчанию — Python. Другой язык — /bootstrap заменяет зависимости,
      # линтер и тесты на свои; шаги процесса ниже остаются.
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest -r tools/requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Проверки
        # Список проверок — в tools/check.sh: его же запускает хук перед git commit.
        run: sh tools/check.sh
