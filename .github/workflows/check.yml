name: check

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]

permissions:
  contents: read
  pull-requests: read

# PR, открытый сразу с меткой, даёт события opened и labeled — два прогона и два слияния.
# Прогоны одного PR (и одной ветки при push) — в одну очередь, устаревший отменяется.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Стек по умолчанию — Python. Другой язык — /bootstrap заменяет зависимости,
      # линтер и тесты на свои; шаги процесса ниже остаются.
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest -r tools/requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Проверки
        # Полный прогон: локально хук гоняет `check.sh --quick` — только затронутые тесты.
        run: sh tools/check.sh

      - name: Слова, закрывающие задачу
        # Задачу закрывает только хозяин (CLAUDE.md, «Задачи»): close/fix/resolve рядом со
        # ссылкой в заголовке, описании или коммитах PR закрыли бы её при слиянии.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" \
            --json title,body,commits > pr.json
          python3 tools/closing_words.py --pr pr.json

  automerge:
    # PR с меткой automerge сливается, когда полный прогон зелёный. Сливает сам CI: защита
    # ветки с обязательной проверкой в приватном репозитории на бесплатном тарифе недоступна.
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'automerge')
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Слить
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --merge
