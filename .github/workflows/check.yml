name: check

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]

permissions:
  contents: read
  pull-requests: read

# PR, открытый сразу с меткой, даёт события opened и labeled — два прогона и два слияния.
# Прогоны одного PR (и одной ветки при push) — в одну очередь, устаревший отменяется.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # вся история: номер задачи проверяется во всех коммитах ветки от базы
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Стек по умолчанию — Python. Другой язык — /bootstrap заменяет зависимости,
      # линтер и тесты на свои; шаги процесса ниже остаются.
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest -r tools/requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: gitleaks
        # Архив релиза, сверенный по контрольным суммам; версия — tools/secret_scan.py.
        run: |
          python3 tools/secret_scan.py install --binary
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Проверки
        # Полный прогон: локально хук гоняет `check.sh --quick` — только затронутые тесты.
        run: sh tools/check.sh

      - name: Номер задачи в каждом коммите
        # Хук commit-msg обходится `--no-verify` — поэтому то же правило здесь.
        if: github.event_name == 'pull_request'
        run: python3 tools/commit_check.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Ключи в коммитах
        # Хук pre-commit обходится `--no-verify` — поэтому то же по всем коммитам PR.
        if: github.event_name == 'pull_request'
        run: python3 tools/secret_scan.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Слова, закрывающие задачу
        # Задачу закрывает только хозяин (AGENTS.md, «Задачи»): close/fix/resolve рядом со
        # ссылкой в заголовке, описании или коммитах PR закрыли бы её при слиянии.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" \
            --json title,body,commits > pr.json
          python3 tools/closing_words.py --pr pr.json

  automerge:
    # PR с меткой automerge сливается, когда полный прогон зелёный. Сливает сам CI: защита
    # ветки с обязательной проверкой в приватном репозитории на бесплатном тарифе недоступна.
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'automerge')
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Слить
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --merge
